<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elo Matchmaking - API Test</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 2rem; 
            background-color: #0f172a; 
            color: #f8fafc; 
            max-width: 800px;
            margin: 0 auto;
        }
        .container {
            background-color: #1e293b; 
            padding: 2rem; 
            border-radius: 12px; 
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        button { 
            padding: 0.75rem 1.5rem; 
            background-color: #6366f1; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer; 
            transition: background-color 0.2s;
        }
        button:hover { background-color: #4f46e5; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        pre { 
            background-color: #020617; 
            padding: 1.5rem; 
            border-radius: 8px; 
            overflow-x: auto; 
            color: #10b981; 
            border: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 style="margin-top: 0;">Server Connection Test</h1>
        <p style="color: #94a3b8; margin-bottom: 2rem;">
            Click the button below to trigger the <code>fetch()</code> command. The browser will reach out to your Google Apps Script URL and display the raw JSON data pulled from your Spreadsheet.
        </p>
        
        <button id="pingButton">Ping Backend Database</button>

        <h3 style="margin-top: 2rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem;">Database Response:</h3>
        <pre id="output">Waiting for request...</pre>
    </div>

    <script>
<!-- Inside your <script> tag -->
<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwq6LDLCrEi6_b8_eJL3kE2uHPfqdSItc2xocvdKD_gY0cJfeXylIEH3BOAUPwgEtjpVw/exec";

    // 1. Function to send data
    async function addPlayer(name) {
        await fetch(GAS_URL, {
            method: "POST",
            body: JSON.stringify({ action: "addPlayer", name: name })
        });
        document.getElementById("nameInput").value = ""; // Clear input
    }

    // 2. The Polling Loop (3 seconds)
    async function refreshData() {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        document.getElementById("output").textContent = JSON.stringify(data.playerData, null, 2);
    }

    setInterval(refreshData, 3000); 
    refreshData(); // Run once immediately on load
</script>

<!-- Add this inside your HTML body -->
<div class="container">
    <input type="text" id="nameInput" placeholder="Enter player name...">
    <button onclick="addPlayer(document.getElementById('nameInput').value)">Add Player</button>
    <pre id="output"></pre>
</div>
</body>
</html>
