<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchmaking | Bruchterveld</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div class="shell match-stage">
    <section class="panel match-card">
      <div class="topbar" style="margin-bottom: 16px;">
        <a class="brand" href="profile.html">
          <div class="brand-mark"></div>
          <div class="brand-title">
            <strong>Bruchterveld League</strong>
            <span>Matchmaking</span>
          </div>
        </a>
        <div class="pill-row">
          <a class="pill" href="profile.html">Back to profile</a>
        </div>
      </div>

      <div class="search-animation">
        Searching for match
        <span class="dots"><span></span><span></span><span></span></span>
      </div>
      <h1 style="margin-top: 14px;">Waiting for the sheet to pair you.</h1>
      <p class="muted" id="matchmakingStatus" style="margin-top: 12px;">
        We are checking for another player and an open game.
      </p>

      <div class="stat-grid" style="margin-top: 20px;">
        <div class="stat"><span class="muted">Waiting</span><strong data-stat="waiting">0</strong></div>
        <div class="stat"><span class="muted">Searching</span><strong data-stat="searching">0</strong></div>
        <div class="stat"><span class="muted">In game</span><strong data-stat="inGame">0</strong></div>
        <div class="stat"><span class="muted">Games open</span><strong data-stat="availableGames">0</strong></div>
      </div>

      <div class="divider"></div>
      <div class="stack">
        <div class="status-box">
          <div class="status-label">Match found</div>
          <div class="status-value hidden" id="matchFlash"></div>
        </div>
        <button class="button secondary" id="cancelButton">Return to profile</button>
      </div>
    </section>
  </div>

  <script src="assets/app.js"></script>
  <script>
    const { api, ensurePlayer, loadPlayer, savePlayer, updateStatElements, playerLabel } = window.Bruchterveld;
    const matchmakingStatus = document.getElementById("matchmakingStatus");
    const matchFlash = document.getElementById("matchFlash");
    const cancelButton = document.getElementById("cancelButton");

    let currentPlayer = ensurePlayer();
    let hasMatched = false;

    async function pollMatchmaking() {
      const stored = loadPlayer();
      if (!stored) {
        window.location.href = "index.html";
        return;
      }

      try {
        const result = await api("findMatch", { token: stored.sessionToken, name: stored.name, playerId: stored.playerId });
        updateStatElements(result.counts || {});

        if (result.player) {
          currentPlayer = { ...stored, ...result.player };
          savePlayer(currentPlayer);
        }

        if (result.state === "MATCHED" && result.match) {
          if (!hasMatched) {
            hasMatched = true;
            matchFlash.classList.remove("hidden");
            matchFlash.textContent = `${result.match.player1Name} vs ${result.match.player2Name}`;
            matchmakingStatus.textContent = `Game selected: ${result.match.gameTitle}. Opening the match page...`;
            setTimeout(() => {
              window.location.assign("match.html");
            }, 1800);
          }
          return;
        }

        matchmakingStatus.textContent = result.message || "Still searching for an opponent.";
      } catch (error) {
        matchmakingStatus.textContent = error.message;
      }
    }

    cancelButton.addEventListener("click", () => {
      window.location.href = "profile.html";
    });

    if (currentPlayer) {
      matchmakingStatus.textContent = `Searching as ${playerLabel(currentPlayer)}.`;
    }

    pollMatchmaking();
    setInterval(pollMatchmaking, 3000);
  </script>
</body>
</html>
